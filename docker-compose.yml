# Full stack: Postgres + FastAPI + Next.js.
#   docker compose up -d --build
# Combined production image (root Dockerfile) published on host :80 (Cloudflare):
#   docker compose --profile prod up -d --build app postgres
services:
  postgres:
    # pgvector-enabled Postgres 16 — Stage 6 semantic retrieval (embeddings index).
    # Authoritative metadata still lives in normal tables; vectors are ancillary.
    image: pgvector/pgvector:pg16
    container_name: dhara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhara
      POSTGRES_PASSWORD: dhara_local_password
      POSTGRES_DB: dhara
    ports:
      - "5432:5432"
    volumes:
      - dhara_pg_data:/var/lib/postgresql/data
      - ./backend/db/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhara -d dhara"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhara-backend
    restart: unless-stopped
    # Ensure host.docker.internal resolves (needed when SQL upload / DSNs use
    # localhost — sql_extract rewrites those to host.docker.internal).
    # Custom public DNS below can otherwise leave that name unresolvable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Prefer Docker embedded DNS for Compose service names, then public
    # resolvers for Neon / external hosts (ISP DNS often fails for those).
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      # Must win over backend/.env (which uses localhost for host-run backends).
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL: Podman/rootless mangles CMD + python -c arg splitting.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend:/backend
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhara-frontend
    restart: unless-stopped
    ports:
      # Host :80 for Cloudflare Tunnel / reverse proxy; Next still listens on 3000 inside.
      - "80:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Named volume can be empty/stale after package changes — install, build,
    # then serve production (bind mount overwrites the image's .next).
    command: sh -c "npm ci && npm run build && npm run start"

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhara-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      # Host :80 for Cloudflare Tunnel; app still listens on PORT (8080) inside.
      - "80:8080"
    environment:
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Hit FastAPI directly (Next proxies /api on :8080; backend is on BACKEND_PORT).
      # CMD-SHELL: Podman/rootless mangles CMD + python -c arg splitting.
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import os,urllib.request; p=os.environ.get('BACKEND_PORT','8000'); urllib.request.urlopen(f'http://127.0.0.1:{p}/api/ready')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  dhara_pg_data:
  frontend_node_modules:
