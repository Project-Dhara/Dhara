# Full stack: Postgres + FastAPI + Vite.
#   docker compose up -d --build
# Combined production image (root Dockerfile) on :8080:
#   docker compose --profile prod up -d --build app postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: dhara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhara
      POSTGRES_PASSWORD: dhara_local_password
      POSTGRES_DB: dhara
    ports:
      - "5432:5432"
    volumes:
      - dhara_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhara -d dhara"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhara-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhara-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhara-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dhara_pg_data:
  frontend_node_modules:
