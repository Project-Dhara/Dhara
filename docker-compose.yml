# Full stack: Postgres + FastAPI + Next.js.
#   docker compose up -d --build
# Combined production image (root Dockerfile) on :8080:
#   docker compose --profile prod up -d --build app postgres
services:
  postgres:
    # pgvector-enabled Postgres 16 — Stage 6 semantic retrieval (embeddings index).
    # Authoritative metadata still lives in normal tables; vectors are ancillary.
    image: pgvector/pgvector:pg16
    container_name: dhara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhara
      POSTGRES_PASSWORD: dhara_local_password
      POSTGRES_DB: dhara
    ports:
      - "5432:5432"
    volumes:
      - dhara_pg_data:/var/lib/postgresql/data
      - ./backend/db/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhara -d dhara"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhara-backend
    restart: unless-stopped
    # Ensure host.docker.internal resolves (needed when SQL upload / DSNs use
    # localhost — sql_extract rewrites those to host.docker.internal).
    # Custom public DNS below can otherwise leave that name unresolvable.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Prefer Docker embedded DNS for Compose service names, then public
    # resolvers for Neon / external hosts (ISP DNS often fails for those).
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      # Must win over backend/.env (which uses localhost for host-run backends).
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhara-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Named volume can be empty/stale after package changes — install before
    # starting Next, and bind 0.0.0.0 so host localhost:3000 can reach it.
    command: sh -c "npm ci && npm run dev"

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhara-app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://dhara:dhara_local_password@postgres:5432/dhara
      ENABLE_GCS: "false"
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dhara_pg_data:
  frontend_node_modules:
